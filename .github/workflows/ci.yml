name: 🧪 CI - Tests with Deployment Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 🔧 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: provide-io/ci-tooling/actions/setup-python-env@v0.0.1
        with:
          python-version: '3.11'
          install-extras: 'dev,test'
      - uses: provide-io/ci-tooling/actions/python-quality@v0.0.1
        with:
          source-paths: 'src'

  test:
    name: 🧪 Tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: provide-io/ci-tooling/actions/setup-python-env@v0.0.1
        with:
          python-version: '3.11'
          install-extras: 'dev,test'
      - uses: provide-io/ci-tooling/actions/python-test@v0.0.1

  docs:
    name: 📚 Documentation Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: provide-io/ci-tooling/actions/setup-python-env@v0.0.1
        with:
          python-version: '3.11'
          install-extras: 'dev,test'
      - name: Build docs
        run: |
          source .venv/bin/activate
          mkdocs build
        continue-on-error: true
