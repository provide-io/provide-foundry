name: 🏷️ GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish-testpypi:
        description: 'Publish to TestPyPI'
        type: boolean
        default: false
      publish-pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

permissions:
  contents: write

jobs:
  build:
    name: 📦 Build Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Build package
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: 📋 Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
