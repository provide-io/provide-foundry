# Documentation Manifest for Provide Foundry
#
# This file defines which projects are included in the aggregated documentation
# and how they should be organized in the unified site.

projects:
  # Foundation Layer - Core infrastructure
  foundation:
    source: ../provide-foundation
    target: foundation
    nav_title: Foundation
    description: "Core telemetry and logging infrastructure"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: docs/reference/gen_ref_pages.py

  testkit:
    source: ../provide-testkit
    target: testkit
    nav_title: TestKit
    description: "Testing utilities and fixtures for the foundry"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  # FlavorPack - Packaging system
  flavorpack:
    source: ../flavorpack
    target: flavorpack
    nav_title: FlavorPack
    description: "Progressive Secure Package Format (PSPF/2025) packaging system"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  # PyVider Framework - Terraform provider framework
  pyvider:
    source: ../pyvider
    target: pyvider
    nav_title: PyVider
    description: "Python framework for building Terraform providers"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  pyvider-cty:
    source: ../pyvider-cty
    target: pyvider-cty
    nav_title: PyVider CTY
    description: "CTY type system bindings for PyVider"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  pyvider-hcl:
    source: ../pyvider-hcl
    target: pyvider-hcl
    nav_title: PyVider HCL
    description: "HCL parsing and manipulation for PyVider"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: docs/reference/gen_ref_pages.py

  pyvider-rpcplugin:
    source: ../pyvider-rpcplugin
    target: pyvider-rpcplugin
    nav_title: PyVider RPC Plugin
    description: "RPC plugin implementation for PyVider providers"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: docs/reference/gen_ref_pages.py

  # Development Tools
  wrknv:
    source: ../wrknv
    target: wrknv
    nav_title: WrkNv
    description: "Workspace environment management tool"
    enabled: true
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  # Optional/Future Projects (disabled for now)
  pyvider-components:
    source: ../pyvider-components
    target: pyvider-components
    nav_title: PyVider Components
    description: "Reusable components for PyVider providers"
    enabled: false
    api_docs:
      enabled: true
      method: plating
      note: "Uses PlatingAPI for Terraform provider documentation"

  plating:
    source: ../plating
    target: plating
    nav_title: Plating
    description: "Template management and code generation"
    enabled: false
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  tofusoup:
    source: ../tofusoup
    target: tofusoup
    nav_title: TofuSoup
    description: "OpenTofu/Terraform configuration management"
    enabled: false
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  supsrc:
    source: ../supsrc
    target: supsrc
    nav_title: SupSrc
    description: "Source code management utilities"
    enabled: false
    api_docs:
      enabled: true
      method: gen-files
      script: ../provide-foundry/scripts/gen_ref_pages.py

  terraform-provider-pyvider:
    source: ../terraform-provider-pyvider
    target: terraform-provider-pyvider
    nav_title: Terraform Provider PyVider
    description: "Reference implementation of a PyVider-based Terraform provider"
    enabled: false
    api_docs:
      enabled: false
      method: gen-files
      note: "Project exists but does not have mkdocs.yml configuration yet"

# Global settings for aggregation
settings:
  # Whether to include project navigation in top-level nav
  include_in_nav: true

  # Whether to generate cross-project API references
  cross_references: true

  # Asset handling
  copy_assets: true

  # Watch mode settings
  watch_patterns:
    - "*.md"
    - "*.yml"
    - "*.yaml"
    - "mkdocs.yml"

  # Exclusion patterns
  exclude_patterns:
    - "__pycache__"
    - "*.pyc"
    - ".DS_Store"
    - "node_modules"
    - ".git"

# API Documentation Generation Methods
#
# Projects can use one of these methods for API documentation:
#
# 1. gen-files (Recommended):
#    Uses mkdocs-gen-files + literate-nav plugins to auto-generate API docs
#    at build time from Python source code. Configure in mkdocs.yml:
#      plugins:
#        - gen-files:
#            scripts:
#              - ../provide-foundry/scripts/gen_ref_pages.py  # Shared template
#        - literate-nav:
#            nav_file: SUMMARY.md
#
# 2. plating (Terraform Providers Only):
#    Uses PlatingAPI for Terraform-specific provider documentation.
#    Generates function, resource, and data source documentation.
#    Run: python scripts/regenerate_docs.py
#
# 3. manual:
#    Hand-written API documentation files.
#    Use when auto-generation doesn't meet specific needs.