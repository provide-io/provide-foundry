site_name: Provide Foundry Documentation
site_url: https://foundry.provide.io
site_description: Comprehensive documentation for the Provide Foundry collection of Python tools and frameworks
repo_url: https://github.com/provide-io/provide-io
repo_name: provide-io/provide-io
edit_uri: edit/main/provide-foundry/docs/

# Development server configuration
dev_addr: '127.0.0.1:8000'

# Use aggregated documentation directory
docs_dir: .docs_aggregated

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - ../provide-foundation/src
            - ../provide-testkit/src
            - ../flavorpack/src
            - ../pyvider/src
            - ../pyvider-cty/src
            - ../pyvider-hcl/src
            - ../pyvider-rpcplugin/src
            - ../wrknv/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            show_bases: true
            merge_init_into_class: true
            separate_signature: true
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false

extra_css:
  - stylesheets/provide-theme.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/provide-io
    - icon: fontawesome/brands/python
      link: https://pypi.org/user/provide-io/
  analytics:
    provider: google
    property: !ENV GA_TRACKING_ID

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: provide-io
      repo: provide-io
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started: getting-started.md

  # Foundation Layer
  - Foundation: foundation/index.md
  - TestKit: testkit/index.md

  # FlavorPack - Packaging System
  - FlavorPack: flavorpack/index.md

  # PyVider Framework
  - PyVider: pyvider/index.md
  - PyVider CTY: pyvider-cty/index.md
  - PyVider HCL: pyvider-hcl/index.md
  - PyVider RPC Plugin: pyvider-rpcplugin/index.md

  # Development Tools
  - WrkNv: wrknv/index.md

  # Foundry Information
  - Foundry:
    - foundry/index.md
    - Architecture: foundry/architecture.md
    - Design Principles: foundry/principles.md
    - Roadmap: foundry/roadmap.md

  # Guides and API
  - Guides:
    - guides/index.md
    - Installation: guides/installation.md
  - API Reference:
    - api/index.md

hooks:
  - scripts/docs_hooks.py

watch:
  - docs/
  - ../provide-foundation/docs/
  - ../provide-testkit/docs/
  - ../pyvider/docs/
  - ../pyvider-cty/docs/
  - ../pyvider-hcl/docs/
  - ../pyvider-rpcplugin/docs/
  - ../flavorpack/docs/
  - ../wrknv/docs/