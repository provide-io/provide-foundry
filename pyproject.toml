#
# provide-foundry pyproject.toml
#
# Documentation hub for the provide.io ecosystem
#

[project]
name = "provide-foundry"
version = "0.1.0"
description = "Documentation hub for the provide.io ecosystem"
authors = [
    {name = "Provide Technologies", email = "hello@provide.io"},
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tomli>=2.2.1",  # For configuration parsing
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-autorefs>=1.4.0",
    "mike>=2.1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]

